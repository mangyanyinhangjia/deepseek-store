<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DeepSeek Store — an independent front-end coursework demonstration."><title>Registration & contacts | DeepSeek Store</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="app.js"></script></head><body data-page="contact"><header id="header"></header><main class="wrap"><div class="pageheading"><span class="eyebrow">Let’s get started</span><h1>Your next chapter starts here.</h1><p class="muted">Try our registration and contact forms. All submissions stay in this demonstration.</p></div><div class="panels"><section class="panel"><h2>Create your account</h2><p class="muted">Explore the registration experience.</p><form id="registration" novalidate><div class="field"><label for="reg-name">Your name</label><input id="reg-name" name="name" type="text" required autocomplete="name" aria-describedby="reg-name-error"><span class="error" id="reg-name-error" data-error="name"></span></div><div class="field"><label for="reg-email">Email address</label><input id="reg-email" name="email" type="email" required autocomplete="email" aria-describedby="reg-email-error"><span class="error" id="reg-email-error" data-error="email"></span></div><div class="field"><label for="reg-password">Password · at least 8 characters</label><input id="reg-password" name="password" type="password" required minlength="8" autocomplete="new-password" aria-describedby="reg-password-error"><span class="error" id="reg-password-error" data-error="password"></span></div><div class="field"><label for="reg-confirm">Confirm password</label><input id="reg-confirm" name="confirm" type="password" required autocomplete="new-password" aria-describedby="reg-confirm-error"><span class="error" id="reg-confirm-error" data-error="confirm"></span></div><button class="btn" type="submit">Create demo account →</button><p class="success" role="status"></p></form></section><section class="panel"><h2>Get in touch</h2><p class="muted">Have a question? Try the contact form.</p><form id="contact-form" novalidate><div class="field"><label for="msg-name">Your name (optional)</label><input id="msg-name" name="name" type="text"  autocomplete="name" aria-describedby="msg-name-error"><span class="error" id="msg-name-error" data-error="name"></span></div><div class="field"><label for="msg-email">Email address</label><input id="msg-email" name="email" type="email" required autocomplete="email" aria-describedby="msg-email-error"><span class="error" id="msg-email-error" data-error="email"></span></div><div class="field"><label for="msg-subject">Subject</label><input id="msg-subject" name="subject" type="text" required  aria-describedby="msg-subject-error"><span class="error" id="msg-subject-error" data-error="subject"></span></div><div class="field"><label for="msg-message">Message</label><textarea id="msg-message" name="message" rows="4" aria-describedby="msg-message-error"></textarea><span class="error" id="msg-message-error" data-error="message"></span></div><button class="btn" type="submit">Validate message →</button><p class="success" role="status"></p></form><p class="muted" style="font-size:12px">Optional name defaults to Guest. No email is sent.</p></section></div></main><footer id="footer"></footer></body></html>
